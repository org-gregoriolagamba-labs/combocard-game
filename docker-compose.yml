# PostgreSQL per lo sviluppo locale: docker compose up -d
# Le credenziali valgono solo in locale: non usarle in produzione.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: combocard
      POSTGRES_PASSWORD: combocard
      POSTGRES_DB: combocard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - combocard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U combocard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  combocard-postgres:
